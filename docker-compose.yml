version: '3.8'

services:
  owlbot:
    build: .
    image: leonid27/owl-bot:latest
    volumes:
      - ./tg.key:/app/tg.key:z
      - ./schedule_cache:/app/schedule_cache:z
      - ./data:/app/data:z
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Moscow
      - STATS_DB_PATH=/app/data/stats.db
    restart: unless-stopped
