version: '3.8'

services:
  owlbot:
    build: .
    image: leonid27/owl-bot:latest
    volumes:
      - ./tg.key:/app/tg.key:z
      - ./schedule_cache:/app/schedule_cache:z
      - ./models:/app/models:z
      - ./stats.db:/app/stats.db:z
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Moscow
    restart: unless-stopped
